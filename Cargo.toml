[package]
name = "character-screen"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A simple character map renderer inspired by early 8-bit graphics processors"
repository = "https://github.com/What42Pizza/character-screen"

[dependencies.wgpu]
	version = "29.*" # NOTE: wgpu 30.* seems to have some pretty bad input lag problems
	default-features = false
	features = [ "std", "dx12", "metal", "gles", "vulkan" ]
[dependencies.simple-gpu]
	git = "https://github.com/What42Pizza/rust-simple-gpu"
	features = [ "glsl" ]
	default-features = false
[dependencies.anyhow]
	version = "1.*"
	default-features = false
[dependencies.bytemuck]
	version = "1.*"
	default-features = false

[dev-dependencies.simple-gpu]
	git = "https://github.com/What42Pizza/rust-simple-gpu"
	features = [ "glsl", "image" ]
	default-features = false
[dev-dependencies.sdl3]
	version = "0.22.*"
	features = [ "raw-window-handle", "build-from-source" ]
[dev-dependencies.env_logger]
	version = "0.11.*"
[dev-dependencies.log]
	version = "0.4.*"
