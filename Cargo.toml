[package]
name = "character-screen"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
description = ""
repository = ""
readme = ""
keywords = []
categories = []

[dependencies.wgpu]
	version = "29.*" # NOTE: wgpu 30.* seems to have some pretty bad input lag problems
	default-features = false
	features = [ "std", "dx12", "metal", "gles", "vulkan" ]
[dependencies.simple-gpu]
	path = "/home/what42/Desktop/rust-simple-gpu"
[dependencies.image]
	version = "0.25.*"
	default-features = false
	features = [ "png", "jpeg", "webp", "bmp", "tga" ]
[dependencies.anyhow]
	version = "1.*"
	default-features = false
[dependencies.bytemuck]
	version = "1.*"
	default-features = false
	
[dev-dependencies.sdl3]
	version = "0.22.*"
	features = [ "raw-window-handle", "build-from-source" ]
[dev-dependencies.env_logger]
	version = "0.11.*"
[dev-dependencies.log]
	version = "0.4.*"
